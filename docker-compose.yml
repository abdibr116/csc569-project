services:
  # === Single-seed mode (default) ===
  pipeline:
    profiles: ["single"]
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./paper_sections:/app/paper_sections
    command: ["--pop-size", "${POP_SIZE:-50}", "--generations", "${GENERATIONS:-30}", "--seed", "${SEED:-42}"]

  # === Multi-seed mode: 5 seeds in parallel ===

  # Step 1-3: download, preprocess, baselines (run once)
  setup:
    profiles: ["multi"]
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    entrypoint: ["python", "-c"]
    command:
      - |
        import subprocess, sys
        subprocess.run([sys.executable, 'src/download_data.py'], check=True)
        subprocess.run([sys.executable, 'src/preprocess.py'], check=True)
        subprocess.run([sys.executable, 'src/baseline.py'], check=True)

  # Step 4: GP optimization — one container per seed, run in parallel
  gp-seed-42:
    profiles: ["multi"]
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      setup:
        condition: service_completed_successfully
    entrypoint: ["python", "src/gp_optimize.py"]
    command: ["--pop-size", "${POP_SIZE:-50}", "--generations", "${GENERATIONS:-30}", "--seed", "42", "--results-dir", "results/seed_42"]

  gp-seed-123:
    profiles: ["multi"]
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      setup:
        condition: service_completed_successfully
    entrypoint: ["python", "src/gp_optimize.py"]
    command: ["--pop-size", "${POP_SIZE:-50}", "--generations", "${GENERATIONS:-30}", "--seed", "123", "--results-dir", "results/seed_123"]

  gp-seed-456:
    profiles: ["multi"]
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      setup:
        condition: service_completed_successfully
    entrypoint: ["python", "src/gp_optimize.py"]
    command: ["--pop-size", "${POP_SIZE:-50}", "--generations", "${GENERATIONS:-30}", "--seed", "456", "--results-dir", "results/seed_456"]

  gp-seed-789:
    profiles: ["multi"]
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      setup:
        condition: service_completed_successfully
    entrypoint: ["python", "src/gp_optimize.py"]
    command: ["--pop-size", "${POP_SIZE:-50}", "--generations", "${GENERATIONS:-30}", "--seed", "789", "--results-dir", "results/seed_789"]

  gp-seed-1024:
    profiles: ["multi"]
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      setup:
        condition: service_completed_successfully
    entrypoint: ["python", "src/gp_optimize.py"]
    command: ["--pop-size", "${POP_SIZE:-50}", "--generations", "${GENERATIONS:-30}", "--seed", "1024", "--results-dir", "results/seed_1024"]

  # Step 5-6: aggregate, evaluate, draft paper (after all seeds finish)
  finalize:
    profiles: ["multi"]
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./paper_sections:/app/paper_sections
    depends_on:
      gp-seed-42:
        condition: service_completed_successfully
      gp-seed-123:
        condition: service_completed_successfully
      gp-seed-456:
        condition: service_completed_successfully
      gp-seed-789:
        condition: service_completed_successfully
      gp-seed-1024:
        condition: service_completed_successfully
    entrypoint: ["python", "-c"]
    command:
      - |
        import subprocess, sys
        subprocess.run([sys.executable, 'src/aggregate.py', '--seeds', '42', '123', '456', '789', '1024'], check=True)
        subprocess.run([sys.executable, 'src/evaluate.py'], check=True)
        subprocess.run([sys.executable, 'src/draft_paper.py'], check=True)
