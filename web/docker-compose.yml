services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ../data:/app/data:rw
      - ../results:/app/results:rw
      - ../paper_sections:/app/paper_sections:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - RESULTS_DIR=/app/results
      - PAPER_DIR=/app/paper_sections
      - DATA_DIR=/app/data
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-/data/src/rana/csc569-project}
      - PIPELINE_IMAGE=${PIPELINE_IMAGE:-csc569-project-pipeline}
    networks:
      - default

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.csc569.rule=Host(`csc569.al-ibrahim.info`)"
      - "traefik.http.routers.csc569.entrypoints=websecure"
      - "traefik.http.routers.csc569.tls.certresolver=letsencrypt"
      - "traefik.http.services.csc569.loadbalancer.server.port=80"

networks:
  traefik-network:
    external: true
